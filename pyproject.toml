[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "byteforge-mcp-file-friend-core"
version = "0.0.1"
description = "File Friend lifecycle, storage coordination and worker"
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Jason Byteforge"}]
dependencies = [
    "byteforge-mcp-file-friend-models @ git+https://github.com/jmazzahacks/byteforge-mcp-file-friend-models.git@eb56d7d595aaaab6ca195f5992a822e67bd1a054",
    "psycopg2-binary>=2.9,<3",
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/jmazzahacks/byteforge-mcp-file-friend-core"
Issues = "https://github.com/jmazzahacks/byteforge-mcp-file-friend-core/issues"

[project.scripts]
ff-worker = "byteforge_mcp_file_friend_core.worker:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/byteforge_mcp_file_friend_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--confcutdir=."

[tool.ruff]
line-length = 110

[tool.uv]
exclude-newer = "7 days"
